<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental.Mente AH/SD</title>
    <!-- Biblioteca html2pdf para exportar em PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 15px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 600px; }
        
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: #818cf8; font-size: 1.8rem; margin-bottom: 5px; }
        header p { color: var(--text-muted); font-size: 0.85rem; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: var(--card-dark); color: var(--text-muted); border-radius: 8px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: var(--accent); color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-dark); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        .category-title { font-size: 1.1rem; color: #a5b4fc; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        .criterion-item { margin-bottom: 15px; }
        .criterion-label { display: block; font-size: 0.9rem; margin-bottom: 5px; font-weight: 600; }
        .rating-options { display: flex; gap: 8px; margin-bottom: 6px; }
        .rating-btn { flex: 1; padding: 8px 0; border: 1px solid var(--border); background: #0f172a; color: var(--text-main); border-radius: 6px; cursor: pointer; text-align: center; }
        .rating-btn.selected { background: var(--accent); border-color: #818cf8; }
        
        input[type="text"], input[type="date"] { width: 100%; padding: 8px 12px; background: #0f172a; border: 1px solid var(--border); color: white; border-radius: 6px; font-size: 0.85rem; }

        .btn-main { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .btn-pdf { background: var(--success); margin-bottom: 15px; }
        .btn-sec { background: #334155; padding: 10px; font-size: 0.85rem; border: none; color: white; border-radius: 6px; cursor: pointer; flex: 1; }
        .btn-delete { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; float: right; }

        .trend-card { background: #0f172a; border: 1px solid var(--border); padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .trend-item { font-size: 0.85rem; margin-top: 6px; padding-bottom: 4px; border-bottom: 1px dashed #334155; }

        .history-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--accent); }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .history-date { font-size: 0.85rem; color: #a5b4fc; font-weight: bold; }
        .history-score { font-size: 1rem; font-weight: bold; color: #818cf8; margin-bottom: 8px; }
        .cat-summary { font-size: 0.8rem; background: #1e293b; padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; }
        .notes-list { font-size: 0.8rem; color: #cbd5e1; margin-top: 8px; padding-left: 5px; }

        /* Formatação exclusiva para geração do PDF */
        .pdf-mode { background: #ffffff !important; color: #1e293b !important; padding: 20px !important; }
        .pdf-mode .card, .pdf-mode .history-item, .pdf-mode .trend-card { background: #f8fafc !important; color: #0f172a !important; border: 1px solid #cbd5e1 !important; }
        .pdf-mode .btn-delete { display: none !important; }
        .pdf-mode .history-score, .pdf-mode .category-title { color: #4f46e5 !important; }
        .pdf-mode .cat-summary { background: #e2e8f0 !important; color: #0f172a !important; }
        .pdf-mode .notes-list { color: #334155 !important; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Mental.Mente AH/SD</h1>
        <p>Monitorização Emocional, Saúde Integral e Desenvolvimento em AH/SD</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('registro')">📋 Registo Diário</button>
        <button class="tab-btn" onclick="switchTab('relatorios')">📊 Relatórios & Saldo</button>
    </div>

    <!-- TAB REGISTO DIÁRIO -->
    <div id="tab-registro" class="tab-content active">
        <div class="card">
            <label class="criterion-label">Data do Registo:</label>
            <input type="date" id="reg-date">
        </div>

        <form id="trackerForm">
            <div class="card">
                <div class="category-title">🧠 Neuroemocional & AH/SD</div>
                <div id="cat-neuro"></div>
            </div>

            <div class="card">
                <div class="category-title">🎯 Foco & Cognição</div>
                <div id="cat-foco"></div>
            </div>

            <div class="card">
                <div class="category-title">🌱 Saúde Integral & Rotina</div>
                <div id="cat-saude"></div>
            </div>

            <div class="card">
                <div class="category-title">👥 Conexões & Lazer</div>
                <div id="cat-conexoes"></div>
            </div>

            <button type="submit" class="btn-main">💾 Guardar Registo Diário</button>
        </form>
    </div>

    <!-- TAB RELATÓRIOS -->
    <div id="tab-relatorios" class="tab-content">
        <button onclick="gerarPDF()" class="btn-main btn-pdf">📄 Baixar Relatório em PDF</button>

        <div class="card" style="margin-bottom: 15px;">
            <div style="display: flex; gap: 8px;">
                <button onclick="exportarBackup()" class="btn-sec">📥 Exportar Backup</button>
                <button onclick="document.getElementById('importFile').click()" class="btn-sec">📤 Importar Backup</button>
                <input type="file" id="importFile" style="display:none;" onchange="importarBackup(event)" accept=".json">
            </div>
        </div>

        <div id="area-relatorio" class="card">
            <h2 style="font-size: 1.2rem; margin-bottom: 15px; text-align: center;">Histórico e Análise de Evolução</h2>
            
            <div id="trend-summary"></div>

            <div id="lista-historico">
                <p style="text-align: center; color: var(--text-muted);">Carregando dados...</p>
            </div>
        </div>
    </div>
</div>

<script>
    const categoriesInfo = {
        neuro: '🧠 Neuroemocional & AH/SD',
        foco: '🎯 Foco & Cognição',
        saude: '🌱 Saúde Integral & Rotina',
        conexoes: '👥 Conexões & Lazer'
    };

    const criteriaData = [
        { id: 'c1', cat: 'neuro', name: 'Intensidade Emocional' },
        { id: 'c2', cat: 'neuro', name: 'Sobrecarga Sensorial / Estímulos' },
        { id: 'c3', cat: 'neuro', name: 'Regulação do Humor / Ansiedade' },
        { id: 'c4', cat: 'neuro', name: 'Autoaceitação & Mascaramento (Camouflage)' },
        { id: 'c5', cat: 'foco', name: 'Hiperfoco & Produtividade' },
        { id: 'c6', cat: 'foco', name: 'Organização & Gestão de Tempo' },
        { id: 'c7', cat: 'foco', name: 'Inércia de Ação / Procrastinação' },
        { id: 'c8', cat: 'foco', name: 'Tolerância à Frustração' },
        { id: 'c9', cat: 'saude', name: 'Qualidade do Sono' },
        { id: 'c10', cat: 'saude', name: 'Nível de Energia Física' },
        { id: 'c11', cat: 'saude', name: 'Alimentação & Hidratação' },
        { id: 'c12', cat: 'saude', name: 'Atividade Física / Movimento' },
        { id: 'c13', cat: 'saude', name: 'Tempo Conectado (Ecrãs/Telas)' },
        { id: 'c14', cat: 'conexoes', name: 'Qualidade das Conexões Sociais' },
        { id: 'c15', cat: 'conexoes', name: 'Sentimento de Pertencimento' },
        { id: 'c16', cat: 'conexoes', name: 'Tempo para Interesses / Hobbies' },
        { id: 'c17', cat: 'conexoes', name: 'Descanso / Desconexão do Trabalho' }
    ];

    document.getElementById('reg-date').valueAsDate = new Date();

    function renderForm() {
        criteriaData.forEach(item => {
            const container = document.getElementById(`cat-${item.cat}`);
            if(!container) return;

            const div = document.createElement('div');
            div.className = 'criterion-item';
            div.innerHTML = `
                <label class="criterion-label">${item.name}</label>
                <div class="rating-options">
                    ${[1, 2, 3, 4, 5].map(val => `
                        <button type="button" class="rating-btn" onclick="setRating('${item.id}', ${val}, this)">${val}</button>
                    `).join('')}
                </div>
                <input type="hidden" id="input-${item.id}" name="${item.id}" value="3">
                <input type="text" id="note-${item.id}" placeholder="Nota/Observação (opcional)...">
            `;
            container.appendChild(div);
        });
    }

    function setRating(id, val, btn) {
        document.getElementById(`input-${id}`).value = val;
        const parent = btn.parentElement;
        parent.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        if(tabName === 'registro') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-registro').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-relatorios').classList.add('active');
            carregarHistorico();
        }
    }

    document.getElementById('trackerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const date = document.getElementById('reg-date').value;
        
        let ratings = {};
        let notes = {};
        let totalScore = 0;
        let catTotals = { neuro: 0, foco: 0, saude: 0, conexoes: 0 };
        let catCounts = { neuro: 0, foco: 0, saude: 0, conexoes: 0 };

        criteriaData.forEach(item => {
            const val = parseInt(document.getElementById(`input-${item.id}`).value) || 3;
            const note = document.getElementById(`note-${item.id}`).value;
            ratings[item.id] = val;
            notes[item.id] = note;
            totalScore += val;

            catTotals[item.cat] += val;
            catCounts[item.cat] += 1;
        });

        let catAverages = {};
        Object.keys(catTotals).forEach(cat => {
            catAverages[cat] = (catTotals[cat] / catCounts[cat]).toFixed(1);
        });

        const entry = { 
            id: Date.now(),
            date, 
            ratings, 
            notes, 
            totalScore, 
            average: parseFloat((totalScore / criteriaData.length).toFixed(1)),
            catAverages
        };

        let history = JSON.parse(localStorage.getItem('mentalmente_ahsd_data')) || [];
        history.unshift(entry);
        localStorage.setItem('mentalmente_ahsd_data', JSON.stringify(history));

        alert('Registo guardado com sucesso!');
        switchTab('relatorios');
    });

    function apagarRegisto(id) {
        if(confirm('Tem certeza que deseja apagar este registo?')) {
            let history = JSON.parse(localStorage.getItem('mentalmente_ahsd_data')) || [];
            history = history.filter(item => item.id !== id && item.date !== id);
            localStorage.setItem('mentalmente_ahsd_data', JSON.stringify(history));
            carregarHistorico();
        }
    }

    function carregarHistorico() {
        const container = document.getElementById('lista-historico');
        const trendContainer = document.getElementById('trend-summary');
        const history = JSON.parse(localStorage.getItem('mentalmente_ahsd_data')) || [];

        if(history.length === 0) {
            trendContainer.innerHTML = '';
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nenhum registo guardado ainda.</p>';
            return;
        }

        // Análise de Evolução Detalhada
        if(history.length > 1) {
            const rec = history[0];
            const ant = history[1];
            let diffGeral = (rec.average - ant.average).toFixed(1);
            let iconGeral = diffGeral > 0 ? '📈 Melhora' : (diffGeral < 0 ? '📉 Queda' : '➡️ Estável');

            let htmlTrend = `
                <div class="trend-card">
                    <div style="font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; color: #818cf8;">
                        Análise de Evolução Recente (${rec.date} vs ${ant.date})
                    </div>
                    <div class="trend-item"><strong>Média Geral:</strong> ${rec.average} (${iconGeral} de ${diffGeral})</div>
            `;

            Object.keys(categoriesInfo).forEach(cat => {
                const valRec = parseFloat(rec.catAverages ? rec.catAverages[cat] : 0);
                const valAnt = parseFloat(ant.catAverages ? ant.catAverages[cat] : 0);
                const diff = (valRec - valAnt).toFixed(1);

                let statusText = 'estável';
                let colorClass = 'var(--warning)';

                if(diff > 0) { statusText = `melhorou (+${diff})`; colorClass = 'var(--success)'; }
                else if(diff < 0) { statusText = `diminuiu (${diff})`; colorClass = 'var(--danger)'; }

                htmlTrend += `
                    <div class="trend-item">
                        <strong>${categoriesInfo[cat]}:</strong> <span style="color:${colorClass}">${statusText}</span> (Média: ${valRec})
                    </div>
                `;
            });

            htmlTrend += `</div>`;
            trendContainer.innerHTML = htmlTrend;
        } else {
            trendContainer.innerHTML = `
                <div class="trend-card">
                    <div style="text-align: center; color: #818cf8; font-size: 0.9rem;">
                        Primeiro registo guardado. Adicione mais registos para comparar a evolução por área.
                    </div>
                </div>
            `;
        }

        // Lista do Histórico
        container.innerHTML = history.map(item => {
            const itemId = item.id || item.date;
            return `
                <div class="history-item">
                    <div class="history-header">
                        <span class="history-date">📅 Data: ${item.date}</span>
                        <button class="btn-delete" onclick="apagarRegisto(${itemId})">🗑️ Apagar</button>
                    </div>
                    <div class="history-score">Média Geral: ${item.average} / 5.0</div>
                    
                    ${item.catAverages ? `
                        <div class="cat-summary">
                            <strong>Resumo por Áreas:</strong><br>
                            🧠 Neuro: ${item.catAverages.neuro \vert{}\vert{} '-'} \vert{} 🎯 Foco: ${item.catAverages.foco || '-'} | 🌱 Saúde: ${item.catAverages.saude \vert{}\vert{} '-'} \vert{} 👥 Conexões: ${item.catAverages.conexoes || '-'}
                        </div>
                    ` : ''}

                    <div class="notes-list">
                        ${Object.keys(item.ratings || {}).map(k => {
                            const crit = criteriaData.find(c => c.id === k);
                            const nota = item.notes && item.notes[k] ? ` - <em>"${item.notes[k]}"</em>` : '';
                            return crit ? `<div>• <strong>${crit.name}:</strong> ${item.ratings[k]}/5${nota}</div>` : '';
                        }).join('')}
                    </div>
                </div>
            `;
        }).join('');
    }

    function exportarBackup() {
        const history = localStorage.getItem('mentalmente_ahsd_data');
        if(!history || history === '[]') {
            alert('Não existem dados para exportar.');
            return;
        }
        const blob = new Blob([history], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-mentalmente-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importarBackup(event) {
        const file = event.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if(Array.isArray(data)) {
                    localStorage.setItem('mentalmente_ahsd_data', JSON.stringify(data));
                    alert('Backup restaurado com sucesso!');
                    carregarHistorico();
                } else {
                    alert('Ficheiro de backup inválido.');
                }
            } catch(err) {
                alert('Erro ao ler o ficheiro de backup.');
            }
        };
        reader.readAsText(file);
    }

    function gerarPDF() {
        const elemento = document.getElementById('area-relatorio');
        
        // Aplica o modo PDF para visualização limpa em papel A4
        elemento.classList.add('pdf-mode');

        const opcoes = {
            margin:       10,
            filename:     `relatorio-mentalmente-${new Date().toISOString().slice(0,10)}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opcoes).from(elemento).save().then(() => {
            elemento.classList.remove('pdf-mode');
        });
    }

    renderForm();
</script>

</body>
</html>
