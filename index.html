<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Neuroemocional & AH/SD</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 1.5rem; display: flex; align-items: center; justify-content: center; gap: 10px; color: #ffffff; }

    /* Navegação */
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 12px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: #334155; color: #fff; border-color: #64748b; }

    .aba-conteudo { display: none; }
    .aba-conteudo.active { display: block; }

    /* Cards e Seções */
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }

    /* Caixa Descritiva de Evolução */
    .caixa-analise { background: #0f172a; border-left: 4px solid #38bdf8; padding: 14px; border-radius: 6px; margin-bottom: 16px; font-size: 0.95rem; line-height: 1.5; color: #e2e8f0; }

    /* Ações do Relatório (Botões) */
    .relatorio-acoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 12px; }
    
    .btn { padding: 8px 12px; border: none; border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }

    .btn-baixar { background: #6366f1; color: white; }
    .btn-importar { background: #10b981; color: white; position: relative; }
    .btn-pdf { background: #06b6d4; color: white; }
    .btn-apagar { background: #ef4444; color: white; }

    .btn-importar input[type="file"] { display: none; }
    
    .anotacao-box { background: #0f172a; padding: 10px; border-radius: 6px; font-size: 0.88rem; color: #cbd5e1; margin-top: 8px; border: 1px dashed #334155; }
  </style>

  <!-- Biblioteca para PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🧠 Dashboard Neuroemocional & AH/SD</h1>
    </div>

    <!-- Navegação por Abas -->
    <div class="nav-tabs">
      <button class="tab-btn" onclick="mudarAba('registro', this)">📝 Registro</button>
      <button class="tab-btn active" onclick="mudarAba('relatorios', this)">📁 Relatórios</button>
      <button class="tab-btn" onclick="mudarAba('evolucao', this)">📈 Evolução</button>
    </div>

    <!-- Conteúdo 1: Registro (Espaço mantido) -->
    <div id="aba-registro" class="aba-conteudo">
      <div class="card">
        <p style="color: #94a3b8; text-align: center;">Área de formulário para novos registros diários.</p>
      </div>
    </div>

    <!-- Conteúdo 2: Relatórios -->
    <div id="aba-relatorios" class="aba-conteudo active">
      <div id="lista-relatorios">
        <!-- Renderizado via JS -->
      </div>
    </div>

    <!-- Conteúdo 3: Evolução (App) -->
    <div id="aba-evolucao" class="aba-conteudo">
      <div class="card">
        <div class="card-title" style="margin-bottom:10px;">📊 Análise Descritiva de Evolução (30 Dias)</div>
        <div id="analise-evolucao-app" class="caixa-analise">
          <!-- Texto gerado dinamicamente -->
        </div>
        <div id="historico-evolucao-app">
          <!-- Linha do tempo com anotações -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. BANCO DE DADOS LOCAL ---
    let bancoDeDados = JSON.parse(localStorage.getItem('dashboard_neuroemocional')) || [
      {
        data: '2026-10-01',
        humor: 'Estável',
        foco: 'Alto',
        sobrecarga: 'Baixa',
        observacoes: 'Dia bastante produtivo. Consegui finalizar as tarefas sem sobressaltos e mantive boa autorregulação.'
      },
      {
        data: '2026-09-28',
        humor: 'Ansioso',
        foco: 'Médio',
        sobrecarga: 'Alta',
        observacoes: 'Sensibilidade sensorial muito alta no final da tarde devido a ruídos externos. Precisou de pausa.'
      },
      {
        data: '2026-09-20',
        humor: 'Estável',
        foco: 'Médio',
        sobrecarga: 'Média',
        observacoes: 'Início de semana com rotina ajustada. Houve melhora gradativa no foco em relação aos dias anteriores.'
      },
      {
        data: '2026-09-10',
        humor: 'Desanimado',
        foco: 'Baixo',
        sobrecarga: 'Alta',
        observacoes: 'Sensação de cansaço acumulado. Pouco rendimento nas atividades acadêmicas/profissionais.'
      }
    ];

    function salvarDadosLocais() {
      localStorage.setItem('dashboard_neuroemocional', JSON.stringify(bancoDeDados));
      renderizarTudo();
    }

    // --- 2. GERADOR DE ANÁLISE DESCRITIVA DE EVOLUÇÃO ---
    function gerarTextoDescritivoEvolucao(relatorios) {
      if (!relatorios || relatorios.length === 0) {
        return "Sem dados suficientes no período dos últimos 30 dias para gerar a análise de evolução.";
      }

      // Ordenar por data (mais antigo -> mais recente para avaliar progressão)
      const ordenados = [...relatorios].sort((a, b) => new Date(a.data) - new Date(b.data));
      
      const primeiro = ordenados[0];
      const ultimo = ordenados[ordenados.length - 1];

      let texto = `Acompanhamento do período de ${new Date(primeiro.data + 'T00:00:00').toLocaleDateString('pt-BR')} a ${new Date(ultimo.data + 'T00:00:00').toLocaleDateString('pt-BR')} (${ordenados.length} registros):\n\n`;

      // Análise simples de tendência
      const sobrecargaBaixaOuMedia = ordenados.filter(r => r.sobrecarga === 'Baixa' || r.sobrecarga === 'Média').length;
      const proporcaoEstavel = (sobrecargaBaixaOuMedia / ordenados.length) * 100;

      if (ultimo.humor === 'Estável' || ultimo.humor === 'Calmo') {
        texto += `• **Tendência:** Observa-se uma **melhora na estabilidade emocional** nos registros mais recentes. `;
      } else {
        texto += `• **Tendência:** Os registros mais recentes indicam necessidade de atenção à sobrecarga e regulação do humor. `;
      }

      if (proporcaoEstavel >= 50) {
        texto += `Em ${proporcaoEstavel.toFixed(0)}% dos dias registrados, os níveis de sobrecarga mantiveram-se sob controle (baixa/média).\n`;
      } else {
        texto += `Houve predominância de episódios de sobrecarga elevada no período.\n`;
      }

      texto += `• **Resumo das Anotações:** Destaque para o registro de ${new Date(ultimo.data + 'T00:00:00').toLocaleDateString('pt-BR')} com foco ${ultimo.foco.toLowerCase()} e sobrecarga ${ultimo.sobrecarga.toLowerCase()}.`;

      return texto;
    }

    // --- 3. RENDERIZAR INTERFACE ---
    function renderizarTudo() {
      renderizarRelatorios();
      renderizarEvolucaoApp();
    }

    function renderizarRelatorios() {
      const container = document.getElementById('lista-relatorios');
      container.innerHTML = '';

      if (bancoDeDados.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8;">Nenhum relatório cadastrado.</p>';
        return;
      }

      bancoDeDados.sort((a, b) => new Date(b.data) - new Date(a.data));

      bancoDeDados.forEach(relatorio => {
        const card = document.createElement('div');
        card.className = 'card';
        const dataFormatada = new Date(relatorio.data + 'T00:00:00').toLocaleDateString('pt-BR');

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">📅 Relatório - ${dataFormatada}</span>
          </div>
          <div style="font-size: 0.9rem; color: #cbd5e1; margin-bottom: 8px;">
            <strong>Humor:</strong> ${relatorio.humor} | 
            <strong>Foco:</strong> ${relatorio.foco} | 
            <strong>Sobrecarga:</strong> ${relatorio.sobrecarga}
          </div>
          <div class="anotacao-box">
            <strong>📝 Anotações Diárias:</strong><br>
            ${relatorio.observacoes || 'Nenhuma anotação inserida neste dia.'}
          </div>
          <div class="relatorio-acoes">
            <button class="btn btn-baixar" onclick="baixarJSONDia('${relatorio.data}')">📥 Baixar</button>
            <label class="btn btn-importar">
              📤 Importar
              <input type="file" accept=".json" onchange="importarJSONDia(event, '${relatorio.data}')">
            </label>
            <button class="btn btn-pdf" onclick="gerarPDF30Dias('${relatorio.data}')">📄 Gerar PDF</button>
            <button class="btn btn-apagar" onclick="apagarRelatorioDia('${relatorio.data}')">🗑️ Apagar</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderizarEvolucaoApp() {
      const caixaAnalise = document.getElementById('analise-evolucao-app');
      const historicoContainer = document.getElementById('historico-evolucao-app');

      // Filtrar últimos 30 dias a partir do registro mais recente
      const ordenados = [...bancoDeDados].sort((a, b) => new Date(b.data) - new Date(a.data));
      const dataRef = ordenados.length > 0 ? new Date(ordenados[0].data + 'T00:00:00') : new Date();
      
      const dataInicio = new Date(dataRef);
      dataInicio.setDate(dataRef.getDate() - 30);

      const relatorios30Dias = bancoDeDados.filter(r => {
        const d = new Date(r.data + 'T00:00:00');
        return d >= dataInicio && d <= dataRef;
      });

      caixaAnalise.innerHTML = gerarTextoDescritivoEvolucao(relatorios30Dias).replace(/\n/g, '<br>');

      historicoContainer.innerHTML = '<h4 style="color:#38bdf8; margin: 15px 0 10px 0;">Linha do Tempo e Anotações</h4>';
      
      relatorios30Dias.forEach(r => {
        const dForm = new Date(r.data + 'T00:00:00').toLocaleDateString('pt-BR');
        const item = document.createElement('div');
        item.style.marginBottom = "12px";
        item.innerHTML = `
          <strong style="color:#f8fafc;">${dForm}</strong> - <span style="color:#94a3b8;">Humor: ${r.humor} | Foco: ${r.foco}</span>
          <div class="anotacao-box">${r.observacoes || 'Sem anotações.'}</div>
        `;
        historicoContainer.appendChild(item);
      });
    }

    // --- 4. AÇÕES DOS BOTOES ---
    function baixarJSONDia(data) {
      const relatorio = bancoDeDados.find(item => item.data === data);
      if (!relatorio) return;

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(relatorio, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `relatorio_${data}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importarJSONDia(event, dataOriginal) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const dadosImportados = JSON.parse(e.target.result);
          if (!dadosImportados.data) {
            alert('Arquivo JSON inválido.');
            return;
          }
          const index = bancoDeDados.findIndex(item => item.data === dataOriginal);
          if (index !== -1) {
            bancoDeDados[index] = dadosImportados;
          } else {
            bancoDeDados.push(dadosImportados);
          }
          salvarDadosLocais();
          alert('Relatório importado com sucesso!');
        } catch (err) {
          alert('Erro ao processar o arquivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    // --- 5. GERAR PDF COM EVOLUÇÃO DESCRITIVA + ANOTAÇÕES DIÁRIAS ---
    async function gerarPDF30Dias(dataRef) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const dataFim = new Date(dataRef + 'T00:00:00');
      const dataInicio = new Date(dataFim);
      dataInicio.setDate(dataFim.getDate() - 30);

      const relatorios30Dias = bancoDeDados.filter(item => {
        const d = new Date(item.data + 'T00:00:00');
        return d >= dataInicio && d <= dataFim;
      }).sort((a, b) => new Date(a.data) - new Date(b.data));

      // 1. Cabeçalho
      doc.setFontSize(16);
      doc.setFont("helvetica", "bold");
      doc.text("Relatório Neuroemocional & AH/SD", 14, 18);
      
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`Período analisado: ${dataInicio.toLocaleDateString('pt-BR')} até ${dataFim.toLocaleDateString('pt-BR')} (últimos 30 dias)`, 14, 25);
      doc.line(14, 28, 196, 28);

      let yPos = 35;

      // 2. Seção de Evolução Descritiva
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.text("1. Análise Descritiva de Evolução", 14, yPos);
      yPos += 7;

      doc.setFontSize(9);
      doc.setFont("helvetica", "normal");
      const textoEvolucao = gerarTextoDescritivoEvolucao(relatorios30Dias);
      const linhasEvolucao = doc.splitTextToSize(textoEvolucao, 180);
      doc.text(linhasEvolucao, 14, yPos);
      
      yPos += (linhasEvolucao.length * 5) + 6;
      doc.line(14, yPos, 196, yPos);
      yPos += 8;

      // 3. Seção de Histórico Diário + Anotações
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.text("2. Histórico de Relatórios e Anotações Diárias", 14, yPos);
      yPos += 8;

      relatorios30Dias.forEach((rel) => {
        const dForm = new Date(rel.data + 'T00:00:00').toLocaleDateString('pt-BR');

        // Quebra de página se necessário
        if (yPos > 260) {
          doc.addPage();
          yPos = 20;
        }

        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text(`• Data: ${dForm} | Humor: ${rel.humor} | Foco: ${rel.foco} | Sobrecarga: ${rel.sobrecarga}`, 14, yPos);
        yPos += 5;

        doc.setFontSize(9);
        doc.setFont("helvetica", "italic");
        const anotacaoTexto = `Anotações: ${rel.observacoes || 'Sem anotações registradas.'}`;
        const linhasAnotacao = doc.splitTextToSize(anotacaoTexto, 175);
        doc.text(linhasAnotacao, 18, yPos);

        yPos += (linhasAnotacao.length * 4.5) + 6;
      });

      // Baixar PDF
      doc.save(`Relatorio_Evolucao_Anotacoes_${dataRef}.pdf`);
    }

    function apagarRelatorioDia(data) {
      if (confirm(`Tem certeza que deseja apagar o relatório do dia ${data}?`)) {
        bancoDeDados = bancoDeDados.filter(item => item.data !== data);
        salvarDadosLocais();
      }
    }

    function mudarAba(nomeAba, elemento) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.aba-conteudo').forEach(aba => aba.classList.remove('active'));
      
      elemento.classList.add('active');
      document.getElementById(`aba-${nomeAba}`).classList.add('active');
    }

    // Inicialização
    renderizarTudo();
  </script>
</body>
</html>
