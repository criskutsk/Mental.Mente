<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Neuroemocional & AH/SD</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 16px; }
    
    .container { max-width: 800px; margin: 0 auto; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.4rem; display: flex; align-items: center; justify-content: center; gap: 8px; color: #ffffff; }

    /* Navegação */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    .tab-btn.active { background: #334155; color: #fff; border-color: #64748b; }

    .aba-conteudo { display: none; }
    .aba-conteudo.active { display: block; }

    /* Cards e Containers */
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    .card-title { font-size: 1.05rem; font-weight: bold; color: #38bdf8; margin-bottom: 10px; }

    /* Ações Globais Discretas no Topo */
    .acoes-globais-topo {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    
    .btn-discreto {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-discreto:hover {
      background: #334155;
      color: #fff;
      border-color: #64748b;
    }
    .btn-discreto input[type="file"] { display: none; }

    /* Estilo do Card Diário */
    .relatorio-item {
      background: #0f172a;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .relatorio-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .relatorio-data { font-weight: bold; color: #38bdf8; font-size: 0.95rem; }

    .btn-apagar-diario {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-apagar-diario:hover { background: rgba(239, 68, 68, 0.15); }

    .anotacao-box {
      background: #1e293b;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 8px;
      border-left: 3px solid #64748b;
    }

    /* Caixa Descritiva de Evolução */
    .caixa-analise {
      background: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      color: #e2e8f0;
    }
  </style>

  <!-- Biblioteca jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🧠 Dashboard Neuroemocional & AH/SD</h1>
    </div>

    <!-- Navegação por Abas -->
    <div class="nav-tabs">
      <button class="tab-btn" onclick="mudarAba('registro', this)">📝 Registro</button>
      <button class="tab-btn active" onclick="mudarAba('relatorios', this)">📁 Relatórios</button>
      <button class="tab-btn" onclick="mudarAba('evolucao', this)">📈 Evolução</button>
    </div>

    <!-- Aba 1: Registro -->
    <div id="aba-registro" class="aba-conteudo">
      <div class="card">
        <p style="color: #94a3b8; text-align: center;">Área de formulário para novos registros diários.</p>
      </div>
    </div>

    <!-- Aba 2: Relatórios -->
    <div id="aba-relatorios" class="aba-conteudo active">
      <div class="card">
        <!-- Ações Globais Discretas no Topo -->
        <div class="acoes-globais-topo">
          <button class="btn-discreto" onclick="baixarBackupGeralJSON()">
            📥 Baixar Todos
          </button>
          
          <label class="btn-discreto">
            📤 Importar
            <input type="file" accept=".json" onchange="importarBackupGeralJSON(event)">
          </label>

          <button class="btn-discreto" onclick="gerarPDFGeralMes()">
            📄 PDF do Mês
          </button>
        </div>

        <!-- Lista de Relatórios Diários -->
        <div id="lista-relatorios">
          <!-- Renderizado via JS -->
        </div>
      </div>
    </div>

    <!-- Aba 3: Evolução -->
    <div id="aba-evolucao" class="aba-conteudo">
      <div class="card">
        <div class="card-title">📊 Análise Descritiva de Evolução (30 Dias)</div>
        <div id="analise-evolucao-app" class="caixa-analise">
          <!-- Gerado via JS -->
        </div>
        <div id="historico-evolucao-app">
          <!-- Linha do tempo -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- BANCO DE DADOS LOCAL ---
    let bancoDeDados = JSON.parse(localStorage.getItem('dashboard_neuroemocional')) || [
      {
        data: '2026-10-01',
        humor: 'Estável',
        foco: 'Alto',
        sobrecarga: 'Baixa',
        observacoes: 'Dia bastante produtivo. Consegui finalizar as tarefas sem sobressaltos e mantive boa autorregulação.'
      },
      {
        data: '2026-09-28',
        humor: 'Ansioso',
        foco: 'Médio',
        sobrecarga: 'Alta',
        observacoes: 'Sensibilidade sensorial muito alta no final da tarde devido a ruídos externos. Precisou de pausa.'
      },
      {
        data: '2026-09-20',
        humor: 'Estável',
        foco: 'Médio',
        sobrecarga: 'Média',
        observacoes: 'Início de semana com rotina ajustada. Houve melhora gradativa no foco em relação aos dias anteriores.'
      },
      {
        data: '2026-09-10',
        humor: 'Desanimado',
        foco: 'Baixo',
        sobrecarga: 'Alta',
        observacoes: 'Sensação de cansaço acumulado. Pouco rendimento nas atividades acadêmicas/profissionais.'
      }
    ];

    function salvarDadosLocais() {
      localStorage.setItem('dashboard_neuroemocional', JSON.stringify(bancoDeDados));
      renderizarTudo();
    }

    // --- GERADOR DA ANÁLISE DESCRITIVA DE EVOLUÇÃO ---
    function gerarTextoDescritivoEvolucao(relatorios) {
      if (!relatorios || relatorios.length === 0) {
        return "Sem registros suficientes nos últimos 30 dias para gerar a análise de evolução.";
      }

      const ordenados = [...relatorios].sort((a, b) => new Date(a.data) - new Date(b.data));
      const primeiro = ordenados[0];
      const ultimo = ordenados[ordenados.length - 1];

      let texto = `Acompanhamento do período de ${new Date(primeiro.data + 'T00:00:00').toLocaleDateString('pt-BR')} a ${new Date(ultimo.data + 'T00:00:00').toLocaleDateString('pt-BR')} (${ordenados.length} registros):\n\n`;

      const sobrecargaBaixaOuMedia = ordenados.filter(r => r.sobrecarga === 'Baixa' || r.sobrecarga === 'Média').length;
      const proporcaoEstavel = Math.round((sobrecargaBaixaOuMedia / ordenados.length) * 100);

      if (ultimo.humor === 'Estável' || ultimo.humor === 'Calmo') {
        texto += `• **Tendência:** Observa-se uma **melhora na estabilidade emocional** nos registros mais recentes. `;
      } else {
        texto += `• **Tendência:** Os registros recentes indicam necessidade de atenção à sobrecarga e regulação do humor. `;
      }

      texto += `Em ${proporcaoEstavel}% dos dias registrados, os níveis de sobrecarga mantiveram-se sob controle (baixa/média).\n`;
      texto += `• **Resumo das Anotações:** Destaque para o registro de ${new Date(ultimo.data + 'T00:00:00').toLocaleDateString('pt-BR')} com foco ${ultimo.foco.toLowerCase()} e sobrecarga ${ultimo.sobrecarga.toLowerCase()}.`;

      return texto;
    }

    // --- RENDERIZAÇÃO DA INTERFACE ---
    function renderizarTudo() {
      renderizarRelatorios();
      renderizarEvolucaoApp();
    }

    function renderizarRelatorios() {
      const container = document.getElementById('lista-relatorios');
      container.innerHTML = '';

      if (bancoDeDados.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 20px;">Nenhum relatório cadastrado.</p>';
        return;
      }

      bancoDeDados.sort((a, b) => new Date(b.data) - new Date(a.data));

      bancoDeDados.forEach(relatorio => {
        const item = document.createElement('div');
        item.className = 'relatorio-item';
        const dataFormatada = new Date(relatorio.data + 'T00:00:00').toLocaleDateString('pt-BR');

        item.innerHTML = `
          <div class="relatorio-item-header">
            <span class="relatorio-data">📅 ${dataFormatada}</span>
            <button class="btn-apagar-diario" onclick="apagarRelatorioDia('${relatorio.data}')" title="Apagar relatório do dia">
              🗑️ Apagar
            </button>
          </div>
          <div style="font-size: 0.85rem; color: #cbd5e1;">
            <strong>Humor:</strong> ${relatorio.humor} | 
            <strong>Foco:</strong> ${relatorio.foco} | 
            <strong>Sobrecarga:</strong> ${relatorio.sobrecarga}
          </div>
          <div class="anotacao-box">
            ${relatorio.observacoes || 'Sem anotações neste dia.'}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function renderizarEvolucaoApp() {
      const caixaAnalise = document.getElementById('analise-evolucao-app');
      const historicoContainer = document.getElementById('historico-evolucao-app');

      const ordenados = [...bancoDeDados].sort((a, b) => new Date(b.data) - new Date(a.data));
      const dataRef = ordenados.length > 0 ? new Date(ordenados[0].data + 'T00:00:00') : new Date();
      
      const dataInicio = new Date(dataRef);
      dataInicio.setDate(dataRef.getDate() - 30);

      const relatorios30Dias = bancoDeDados.filter(r => {
        const d = new Date(r.data + 'T00:00:00');
        return d >= dataInicio && d <= dataRef;
      });

      caixaAnalise.innerHTML = gerarTextoDescritivoEvolucao(relatorios30Dias)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');

      historicoContainer.innerHTML = '<h4 style="color:#38bdf8; margin: 15px 0 10px 0; font-size: 0.95rem;">Linha do Tempo e Anotações</h4>';
      
      relatorios30Dias.forEach(r => {
        const dForm = new Date(r.data + 'T00:00:00').toLocaleDateString('pt-BR');
        const elem = document.createElement('div');
        elem.style.marginBottom = "12px";
        elem.innerHTML = `
          <strong style="color:#f8fafc; font-size:0.88rem;">${dForm}</strong> - <span style="color:#94a3b8; font-size:0.85rem;">Humor: ${r.humor} | Foco: ${r.foco}</span>
          <div class="anotacao-box">${r.observacoes || 'Sem anotações.'}</div>
        `;
        historicoContainer.appendChild(elem);
      });
    }

    // --- AÇÕES GLOBAIS NO TOPO (BAIXAR / IMPORTAR / PDF MÊS) ---
    function baixarBackupGeralJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bancoDeDados, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `backup_relatorios_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importarBackupGeralJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const dadosImportados = JSON.parse(e.target.result);
          if (Array.isArray(dadosImportados)) {
            bancoDeDados = dadosImportados;
          } else if (dadosImportados.data) {
            const idx = bancoDeDados.findIndex(i => i.data === dadosImportados.data);
            if (idx !== -1) bancoDeDados[idx] = dadosImportados;
            else bancoDeDados.push(dadosImportados);
          }
          salvarDadosLocais();
          alert('Dados importados com sucesso!');
        } catch (err) {
          alert('Erro ao importar arquivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    // --- PDF GERAL DO MÊS (TODOS OS RELATÓRIOS DO MÊS + EVOLUÇÃO) ---
    async function gerarPDFGeralMes() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const hoje = new Date();
      const mesAtual = hoje.getMonth();
      const anoAtual = hoje.getFullYear();

      // Filtrar relatórios do mês atual (ou dos últimos 30 dias se o mês tiver poucos registros)
      const relatoriosDoMes = bancoDeDados.filter(item => {
        const d = new Date(item.data + 'T00:00:00');
        return d.getMonth() === mesAtual && d.getFullYear() === anoAtual;
      }).sort((a, b) => new Date(a.data) - new Date(b.data));

      const relatoriosParaPDF = relatoriosDoMes.length > 0 ? relatoriosDoMes : bancoDeDados;

      // 1. Cabeçalho
      doc.setFontSize(16);
      doc.setFont("helvetica", "bold");
      doc.text("Relatório Neuroemocional & AH/SD", 14, 18);
      
      const nomeMes = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text(`Consolidado Mensal: ${nomeMes.toUpperCase()}`, 14, 25);
      doc.line(14, 28, 196, 28);

      let yPos = 35;

      // 2. Análise Descritiva de Evolução do Mês
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.text("1. Análise Descritiva de Evolução", 14, yPos);
      yPos += 7;

      doc.setFontSize(9);
      doc.setFont("helvetica", "normal");
      const textoEvolucao = gerarTextoDescritivoEvolucao(relatoriosParaPDF).replace(/\*\*/g, '');
      const linhasEvolucao = doc.splitTextToSize(textoEvolucao, 180);
      doc.text(linhasEvolucao, 14, yPos);
      
      yPos += (linhasEvolucao.length * 5) + 6;
      doc.line(14, yPos, 196, yPos);
      yPos += 8;

      // 3. Relatórios Diários e Anotações
      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.text("2. Relatórios e Anotações Diárias do Mês", 14, yPos);
      yPos += 8;

      relatoriosParaPDF.forEach((rel) => {
        const dForm = new Date(rel.data + 'T00:00:00').toLocaleDateString('pt-BR');

        if (yPos > 260) {
          doc.addPage();
          yPos = 20;
        }

        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text(`• Data: ${dForm} | Humor: ${rel.humor} | Foco: ${rel.foco} | Sobrecarga: ${rel.sobrecarga}`, 14, yPos);
        yPos += 5;

        doc.setFontSize(9);
        doc.setFont("helvetica", "italic");
        const anotacaoTexto = `Anotações: ${rel.observacoes || 'Sem anotações registradas.'}`;
        const linhasAnotacao = doc.splitTextToSize(anotacaoTexto, 175);
        doc.text(linhasAnotacao, 18, yPos);

        yPos += (linhasAnotacao.length * 4.5) + 6;
      });

      doc.save(`Relatorio_Mensal_${anoAtual}_${mesAtual + 1}.pdf`);
    }

    function apagarRelatorioDia(data) {
      if (confirm(`Tem certeza que deseja apagar o relatório do dia ${data}?`)) {
        bancoDeDados = bancoDeDados.filter(item => item.data !== data);
        salvarDadosLocais();
      }
    }

    function mudarAba(nomeAba, elemento) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.aba-conteudo').forEach(aba => aba.classList.remove('active'));
      
      elemento.classList.add('active');
      document.getElementById(`aba-${nomeAba}`).classList.add('active');
    }

    // Inicialização
    renderizarTudo();
  </script>
</body>
</html>
